name: Build

on:
  push:
    branches-ignore:
      - 'dependabot/**'
  pull_request:
    branches:
      - 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.repository == 'openthread/ot-b91' && github.run_id) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  pretty:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        persist-credentials: false
    - name: Bootstrap
      run: |
        sudo apt-get update
        sudo apt-get --no-install-recommends install -y clang-format-19 shellcheck shfmt
        python3 -m pip install yapf==0.29.0
    - name: Check
      run: |
        script/make-pretty check

  riscv32-gcc:
    name: riscv32-gcc-${{ matrix.gcc_ver }}
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - gcc_ver: 7
            gcc_download_url: http://wiki.telink-semi.cn/tools_and_sdk/Tools/IDE/telink_riscv_linux_toolchain.zip
            gcc_extract_dir: telink_riscv_linux_toolchain
            gcc_sha256: bfe5dd517b268512fed5b9db956d243c64750c62a1a735ac41bbf0dcb6094489
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        persist-credentials: false
    - name: Cache Telink RISC-V toolchain
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /tmp/${{ matrix.gcc_extract_dir }}
        key: riscv32-gcc-${{ matrix.gcc_ver }}-${{ matrix.gcc_sha256 }}
    - name: Bootstrap
      timeout-minutes: 25
      env:
        GCC_DOWNLOAD_URL: ${{ matrix.gcc_download_url }}
        GCC_EXTRACT_DIR: ${{ matrix.gcc_extract_dir }}
        GCC_SHA256: ${{ matrix.gcc_sha256 }}
      run: |
        set -euo pipefail

        sudo dpkg --add-architecture i386
        sudo rm -f /etc/apt/sources.list.d/*
        apt_opts=(
          -o Acquire::Retries=3
          -o Acquire::http::Timeout=15
          -o Acquire::https::Timeout=15
        )
        sudo apt-get "${apt_opts[@]}" update
        sudo DEBIAN_FRONTEND=noninteractive apt-get "${apt_opts[@]}" \
          --no-install-recommends install -y \
          ca-certificates \
          curl \
          lib32z1 \
          libc6:i386 \
          libncurses5:i386 \
          ninja-build \
          unzip \
          wget

        if [[ -z "${GCC_EXTRACT_DIR}" || "${GCC_EXTRACT_DIR}" == "." || "${GCC_EXTRACT_DIR}" == ".." || "${GCC_EXTRACT_DIR}" == */* ]]; then
          echo "ERROR: invalid GCC_EXTRACT_DIR '${GCC_EXTRACT_DIR}'" >&2
          exit 1
        fi

        toolchain_dir="/tmp/${GCC_EXTRACT_DIR}"

        if [[ ! -x "${toolchain_dir}/nds32le-elf-mculib-v5f/bin/riscv32-elf-gcc" ]]; then
          (
            umask 022
            stage_dir="$(mktemp -d /tmp/.ot-riscv-toolchain.XXXXXX)"
            trap 'rm -rf "${stage_dir}"' EXIT

            archive_path="${stage_dir}/gcc-riscv32.zip"
            extract_root="${stage_dir}/extracted"
            mkdir -p "${extract_root}"

            # wiki.telink-semi.cn serves this archive over plain HTTP (its
            # HTTPS certificate is expired); integrity is verified via SHA-256.
            if ! timeout --foreground 600 curl \
                --proto '=http,https' --proto-redir '=http,https' -fsSL \
                --retry 3 --retry-delay 2 --retry-max-time 600 \
                --connect-timeout 15 --max-time 600 \
                --speed-limit 10240 --speed-time 30 \
                -o "${archive_path}" "${GCC_DOWNLOAD_URL}"; then
              echo "WARNING: curl download failed, retrying with wget..." >&2
              rm -f "${archive_path}"
              timeout --foreground 600 wget --tries=3 --waitretry=2 \
                --dns-timeout=15 --connect-timeout=15 --read-timeout=30 \
                --no-verbose -O "${archive_path}" "${GCC_DOWNLOAD_URL}"
            fi

            echo "${GCC_SHA256}  ${archive_path}" | sha256sum -c -
            unzip -q "${archive_path}" -d "${extract_root}"
            rm -f "${archive_path}"

            extracted_dir="${extract_root}/${GCC_EXTRACT_DIR}"
            if [[ ! -x "${extracted_dir}/nds32le-elf-mculib-v5f/bin/riscv32-elf-gcc" ]]; then
              echo "ERROR: expected compiler missing under '${extracted_dir}'" >&2
              exit 1
            fi

            chmod 0755 "${extracted_dir}"
            rm -rf "${toolchain_dir}"
            mv "${extracted_dir}" "${toolchain_dir}"
          )
        fi
    - name: Build
      env:
        GCC_EXTRACT_DIR: ${{ matrix.gcc_extract_dir }}
      run: |
        export PATH="/tmp/${GCC_EXTRACT_DIR}/nds32le-elf-mculib-v5f/bin:${PATH}"
        script/test
